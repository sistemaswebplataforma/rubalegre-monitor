name: Monitor

# Cada 5 minutos (GitHub puede demorar unos minutos en horas de mucha carga) y a mano.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar monitor
        env:
          MONITOR_USERNAME: ${{ secrets.MONITOR_USERNAME }}
          MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
        run: python run_monitor.py --diagnose
